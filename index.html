<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سایت من</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Tahoma, sans-serif;
    background: linear-gradient(135deg, #0f172a, #2563eb);
    color: white;
}

.container {
    width: 85%;
    max-width: 380px;
    padding: 35px 20px;
    text-align: center;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 24px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.25);
}

h1 {
    font-size: 25px;
    margin-bottom: 25px;
}

button {
    padding: 15px 30px;
    border: none;
    border-radius: 14px;
    background: #38bdf8;
    color: #0f172a;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.96);
}

#message {
    display: none;
    margin-top: 25px;
    font-size: 25px;
    font-weight: bold;
    animation: appear 0.4s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>سلام، خوش اومدی! 👋</h1>

    <button onclick="showMessage()">اینجا کلیک کن</button>

    <div id="message">سلام خوبی؟ 😊</div>
</div>

<script>
function showMessage() {
    document.getElementById("message").style.display = "block";
}
</script>

</body>
</html>
